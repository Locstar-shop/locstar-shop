<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng nhập - LOC STAR</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f6fa;
}

.header {
    height: 72px;
    background: #30265b;
    color: white;
    display: flex;
    align-items: center;
    padding-left: 60px;
    font-size: 28px;
    font-weight: bold;
}

.login-box {
    width: 500px;
    max-width: 90%;
    margin: 60px auto;
    background: white;
    padding: 35px;
    border-radius: 14px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #30265b;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    margin: 15px 0 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 7px;
    background: #347ee8;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #2468c9;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

.register {
    text-align: center;
    margin-top: 20px;
}

.register a {
    color: #347ee8;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="header">
    LOC STAR
</div>

<div class="login-box">

    <h1>Đăng nhập</h1>

    <form onsubmit="loginAccount(event)">

        <label>Tên tài khoản</label>

        <input
            type="text"
            id="username"
            placeholder="Nhập tên tài khoản"
            required
        >

        <label>Mật khẩu</label>

        <input
            type="password"
            id="password"
            placeholder="Nhập mật khẩu"
            required
        >

        <button id="loginButton" type="submit">
            ĐĂNG NHẬP
        </button>

        <div id="message" class="message"></div>

    </form>

    <div class="register">
        Chưa có tài khoản?
        <a href="register.html">Đăng ký ngay</a>
    </div>

</div>


<script>

const API_URL =
    "https://locstar-shop-api.onrender.com";


async function loginAccount(event) {

    event.preventDefault();

    const username =
        document.getElementById("username")
            .value
            .trim();

    const password =
        document.getElementById("password")
            .value;

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    if (!username || !password) {

        message.style.color = "red";

        message.textContent =
            "Vui lòng nhập đầy đủ thông tin!";

        return;
    }


    button.disabled = true;

    button.textContent =
        "ĐANG ĐĂNG NHẬP...";

    message.textContent = "";


    try {

        const response =
            await fetch(
                API_URL +
                "/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            message.style.color =
                "red";

            message.textContent =
                data.message ||
                "Đăng nhập thất bại.";

            button.disabled = false;

            button.textContent =
                "ĐĂNG NHẬP";

            return;
        }


        // Lưu token đăng nhập
        localStorage.setItem(
            "authToken",
            data.token
        );


        // Lưu thông tin tài khoản
        localStorage.setItem(
            "username",
            data.user.username
        );

        localStorage.setItem(
            "email",
            data.user.email
        );

        localStorage.setItem(
            "depositCode",
            data.user.depositCode
        );

        localStorage.setItem(
            "loggedIn",
            "true"
        );


        message.style.color =
            "green";

        message.textContent =
            "Đăng nhập thành công!";


        setTimeout(() => {

            window.location.href =
                "index.html";

        }, 500);


    } catch (error) {

        console.error(error);

        message.style.color =
            "red";

        message.textContent =
            "Không thể kết nối máy chủ.";

        button.disabled = false;

        button.textContent =
            "ĐĂNG NHẬP";
    }
}

</script>

</body>
</html>
