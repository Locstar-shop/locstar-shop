<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - LOC STAR</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f6fa;
}

.header {
    height: 72px;
    background: #30265b;
    color: white;
    display: flex;
    align-items: center;
    padding-left: 60px;
    font-size: 28px;
    font-weight: bold;
}

.login-box {
    width: 500px;
    max-width: 90%;
    margin: 60px auto;
    background: white;
    padding: 35px;
    border-radius: 14px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #30265b;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    margin: 15px 0 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 7px;
    background: #347ee8;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #2468c9;
}

.register {
    text-align: center;
    margin-top: 20px;
}

.register a {
    color: #347ee8;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="header">
    LOC STAR
</div>

<div class="login-box">

    <h1>Đăng nhập</h1>

    <form onsubmit="loginAccount(event)">

        <label>Tên tài khoản</label>
        <input type="text" id="username" placeholder="Nhập tên tài khoản" required>

        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu" required>

        <button type="submit">ĐĂNG NHẬP</button>

    </form>

    <div class="register">
        Chưa có tài khoản?
        <a href="register.html">Đăng ký ngay</a>
    </div>

</div>

<script>

function loginAccount(event) {

    event.preventDefault();

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    let savedUsername = localStorage.getItem("username");
    let savedPassword = localStorage.getItem("password");

    if (username === savedUsername && password === savedPassword) {

        localStorage.setItem("loggedIn", "true");

        alert("Đăng nhập thành công!");

        window.location.href = "index.html";

    } else {

        alert("Sai tên tài khoản hoặc mật khẩu!");

    }
}


function loginAccount(event) {
    event.preventDefault();

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    let savedUsername = localStorage.getItem("username");
    let savedPassword = localStorage.getItem("password");

    if (username === "" || password === "") {
        alert("Vui lòng nhập đầy đủ thông tin!");
        return;
    }

    if (username === savedUsername && password === savedPassword) {
        localStorage.setItem("loggedIn", "true");

        alert("Đăng nhập thành công!");

        window.location.href = "index.html";
    } else {
        alert("Tên tài khoản hoặc mật khẩu không đúng!");
    }
}
</script>

</body>
</html>
