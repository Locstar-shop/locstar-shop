<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nạp tiền - LOC STAR</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f8;
}

.header {
    background: #34265f;
    color: white;
    padding: 25px 40px;
    font-size: 30px;
    font-weight: bold;
}

.container {
    max-width: 650px;
    margin: 50px auto;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #34265f;
}

.balance {
    background: #4b9df8;
    color: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    font-size: 20px;
    margin-bottom: 25px;
}

.amounts {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.amount {
    padding: 18px;
    border: 2px solid #4b9df8;
    border-radius: 8px;
    background: white;
    color: #34265f;
    font-size: 17px;
    cursor: pointer;
}

.amount:hover {
    background: #4b9df8;
    color: white;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #2878e8;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="header">
    LOC STAR
</div>

<div class="container">

    <h1>Nạp tiền</h1>

    <div class="balance">
        Số dư hiện tại:
        <b id="balance">0đ</b>
    </div>

    <h3>Chọn số tiền muốn nạp</h3>

    <div class="amounts">

    <button class="amount" onclick="chonTien(10000)">
        10.000đ
    </button>

    <button class="amount" onclick="chonTien(20000)">
        20.000đ
    </button>

    <button class="amount" onclick="chonTien(50000)">
        50.000đ
    </button>

    <button class="amount" onclick="chonTien(100000)">
        100.000đ
    </button>

    <button class="amount" onclick="chonTien(200000)">
        200.000đ
    </button>

    <button class="amount" onclick="chonTien(500000)">
        500.000đ
    </button>

</div>

<div id="payment" style="display:none; margin-top:30px; padding:20px; background:#f1f3f8; border-radius:10px;">

    <h2 style="color:#34265f; text-align:center;">
        Thông tin chuyển khoản
    </h2>

    <p>
        <b>Ngân hàng:</b> Vietcombank
    </p>

    <p>
        <b>Số tài khoản:</b>
        <span id="bankNumber">9369549277</span>
    </p>

    <p>
        <b>Chủ tài khoản:</b> NGUYEN TAN LOC
    </p>

    <p>
        <b>Số tiền:</b>
        <span id="paymentAmount">0đ</span>
    </p>

    <p>
        <b>Nội dung chuyển khoản:</b>
    </p>

    <div style="background:white; padding:15px; border-radius:8px; text-align:center;">
        <b id="transferCode">NAPTIEN</b>
    </div>
<div style="text-align:center; margin:20px 0;">

    <h3 style="color:#34265f;">
        📱 Quét QR để chuyển khoản
    </h3>

    <img id="vietqr"
         src="https://img.vietqr.io/image/VCB-9369549277-compact2.jpg"
         alt="QR Vietcombank"
         style="width:300px; max-width:100%; border-radius:10px;">

    <br><br>

    <button onclick="copyBankNumber()"
            style="background:#4285f4; color:white; border:0; padding:12px 20px; border-radius:8px; cursor:pointer;">
        📋 Sao chép số tài khoản
    </button>

    <button onclick="copyTransferContent()"
            style="background:#20bf55; color:white; border:0; padding:12px 20px; border-radius:8px; cursor:pointer;">
        📋 Sao chép nội dung
    </button>

</div>
    <button onclick="xacNhanNap()" style="
        width:100%;
        margin-top:20px;
        padding:15px;
        border:none;
        border-radius:8px;
        background:#22c55e;
        color:white;
        font-size:16px;
        cursor:pointer;
    ">
        Tôi đã chuyển khoản
    </button>

</div>
        ← Quay lại trang chủ
    </a>

</div>

<script>

let balance = Number(localStorage.getItem("balance")) || 0;

document.getElementById("balance").textContent =
    balance.toLocaleString("vi-VN") + "đ";

let selectedAmount = 0;

function chonTien(amount) {

    selectedAmount = amount;

    document.getElementById("payment").style.display = "block";

    document.getElementById("paymentAmount").textContent =
        amount.toLocaleString("vi-VN") + "đ";

    const username =
        localStorage.getItem("username") || "khach";

    document.getElementById("transferCode").textContent =
        "NAPTIEN " + username.toUpperCase();
const transferContent =
    "NAPTIEN " + username.toUpperCase();

document.getElementById("vietqr").src =
    "https://img.vietqr.io/image/VCB-9369549277-compact2.jpg" +
    "?amount=" + amount +
    "&addInfo=" + encodeURIComponent(transferContent) +
    "&accountName=" + encodeURIComponent("NGUYEN TAN LOC");
}
function copyBankNumber() {
    const bankNumber = document.getElementById("bankNumber").textContent;

    navigator.clipboard.writeText(bankNumber).then(function() {
        alert("Đã sao chép số tài khoản!");
    });
}

function copyTransferContent() {
    const content = document.getElementById("transferCode").textContent;

    navigator.clipboard.writeText(content).then(function() {
        alert("Đã sao chép nội dung chuyển khoản!");
    });
}
function xacNhanNap() {

    if (selectedAmount <= 0) {
        alert("Vui lòng chọn số tiền muốn nạp!");
        return;
    }

    const username =
        localStorage.getItem("username") || "khach";

    const transferContent =
        document.getElementById("transferCode").textContent;

    const deposit = {
        username: username,
        amount: selectedAmount,
        content: transferContent,
        time: new Date().toLocaleString("vi-VN"),
        status: "Chờ duyệt"
    };

    let deposits =
        JSON.parse(localStorage.getItem("deposits")) || [];

    deposits.push(deposit);

    localStorage.setItem(
        "deposits",
        JSON.stringify(deposits)
    );

    alert(
        "Đã ghi nhận yêu cầu nạp " +
        selectedAmount.toLocaleString("vi-VN") +
        "đ!\n\n" +
        "Trạng thái: Chờ duyệt."
    );
}

</script>

</body>
</html>
