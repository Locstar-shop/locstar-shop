<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f3f8;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #34265f;
}

label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

select,
input,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    margin-top: 8px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

.price-box {

}

.total {

    color: #34265f;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: #20bf55;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.back {
    display: block;
    margin-top: 20px;
    color: #34265f;
    text-decoration: none;
}
</style>
</head>

<label>Link cần tăng</label>

>

<input
    type="number"
    id="quantity"
    value="1000"
    min="1"
>


<div class="price-box">

    <p>
        <b>Đơn giá:</b>
        <span id="unitPrice">500đ / 1000</span>
    </p>

    <p>
        <b>Tổng tiền:</b>
    </p>

        500đ
    </div>

<label>Ghi chú</label>

<textarea
    id="note"
    rows="4"
    placeholder="Ghi chú cho đơn hàng nếu có..."
></textarea>


<button type="button" onclick="datDon()">
    🚀 Đặt đơn
</button>


<a class="back" href="index.html">
    ← Quay lại trang chủ
</a>

<script>

// ===============================
// LẤY CÁC Ô TRÊN TRANG
// ===============================

const platformSelect =
    document.getElementById("platform");

const serviceSelect =
    document.getElementById("service");

const quantityInput =
    document.getElementById("quantity");


// ===============================
// LƯU TOÀN BỘ DỊCH VỤ BAN ĐẦU
// ===============================

const tatCaDichVu =
    Array.from(serviceSelect.options);


// ===============================
// LỌC DỊCH VỤ
// ===============================

function locDichVu() {

    const platform =
        platformSelect.value;

    serviceSelect.innerHTML = "";


    tatCaDichVu
        .filter(function(option) {

            return option.dataset.platform === platform;

        })
        .forEach(function(option) {

            serviceSelect.appendChild(
                option.cloneNode(true)
            );

        });


    // Chọn dịch vụ đầu tiên
    if (serviceSelect.options.length > 0) {

        serviceSelect.selectedIndex = 0;

    }


    tinhTien();
}


// ===============================
// TÍNH TIỀN TỰ ĐỘNG
// ===============================

function tinhTien() {

    const option =
        serviceSelect.options[
            serviceSelect.selectedIndex
        ];


    if (!option) {

        document.getElementById("unitPrice")
            .textContent = "0đ";

        document.getElementById("total")
            .textContent = "0đ";

        return;
    }


    const price =
        Number(option.dataset.price) || 0;


    const unit =
        Number(option.dataset.unit) || 1000;


    const quantity =
        Number(quantityInput.value) || 0;


    const total =
        price * quantity / unit;


    // HIỂN THỊ ĐƠN GIÁ

    document.getElementById("unitPrice")
        .textContent =
        price.toLocaleString("vi-VN")
        + "đ / "
        + unit.toLocaleString("vi-VN");


    // HIỂN THỊ TỔNG TIỀN

    document.getElementById("total")
        .textContent =
        total.toLocaleString("vi-VN")
        + "đ";
}


// ===============================
// ĐẶT ĐƠN
// ===============================

function datDon() {

    const username =
        localStorage.getItem("username");


    if (!username) {

        alert(
            "Vui lòng đăng nhập trước khi đặt đơn!"
        );

        window.location.href =
            "login.html";

        return;
    }


    const link =
        document.getElementById("link")
        .value.trim();


    const quantity =
        Number(quantityInput.value);


    const option =
        serviceSelect.options[
            serviceSelect.selectedIndex
        ];


    if (!option) {

        alert("Vui lòng chọn dịch vụ!");

        return;
    }


    const serviceName =
        option.textContent.trim();


    const price =
        Number(option.dataset.price) || 0;


    const unit =
        Number(option.dataset.unit) || 1000;


    const total =
        price * quantity / unit;


    // ===============================
    // KIỂM TRA LINK
    // ===============================

    if (!link) {

        alert(
            "Vui lòng nhập link cần tăng!"
        );

        return;
    }


    // ===============================
    // KIỂM TRA SỐ LƯỢNG
    // ===============================

    if (!quantity || quantity <= 0) {

        alert(
            "Vui lòng nhập số lượng hợp lệ!"
        );

        return;
    }


    // ===============================
    // LẤY SỐ DƯ
    // ===============================

    let balance =
        Number(
            localStorage.getItem("balance")
        ) || 0;


    // ===============================
    // KIỂM TRA SỐ DƯ
    // ===============================

    if (balance < total) {

        alert(
            "Số dư không đủ!\n\n" +

            "Số dư hiện tại: " +
            balance.toLocaleString("vi-VN") +
            "đ\n" +

            "Cần thanh toán: " +
            total.toLocaleString("vi-VN") +
            "đ\n\n" +

            "Vui lòng nạp thêm tiền."
        );

        return;
    }


    // ===============================
    // TRỪ TIỀN
    // ===============================

    balance =
        balance - total;


    localStorage.setItem(
        "balance",
        balance
    );


    // ===============================
    // TẠO ĐƠN
    // ===============================

    const order = {

        id:
            "LOC" + Date.now(),

        username:
            username,

        platform:
            platformSelect.value,

        service:
            serviceName,

        link:
            link,

        quantity:
            quantity,

        price:
            price,

        unit:
            unit,

        total:
            total,

        note:
            document.getElementById("note")
            .value.trim(),

        time:
            new Date().toLocaleString("vi-VN"),

        status:
            "Chờ xử lý"
    };


    // ===============================
    // LẤY DANH SÁCH ĐƠN
    // ===============================

    let orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];


    // ===============================
    // THÊM ĐƠN
    // ===============================

    orders.push(order);


    // ===============================
    // LƯU ĐƠN
    // ===============================

    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    // ===============================
    // THÔNG BÁO
    // ===============================

    alert(

        "🎉 ĐẶT ĐƠN THÀNH CÔNG!\n\n" +

        "Mã đơn: " +
        order.id +

        "\nNền tảng: " +
        order.platform +

        "\nDịch vụ: " +
        serviceName +

        "\nSố lượng: " +
        quantity.toLocaleString("vi-VN") +

        "\nTổng tiền: " +
        total.toLocaleString("vi-VN") +
        "đ\n\n" +

        "Số dư còn lại: " +
        balance.toLocaleString("vi-VN") +
        "đ\n\n" +

        "Trạng thái: Chờ xử lý"

    );


    // ===============================
    // XÓA LINK + GHI CHÚ
    // ===============================

    document.getElementById("link")
        .value = "";

    document.getElementById("note")
        .value = "";

}


// ===============================
// ĐỔI NỀN TẢNG
// ===============================

platformSelect.addEventListener(
    "change",
    locDichVu
);


// ===============================
// ĐỔI DỊCH VỤ
// ===============================

serviceSelect.addEventListener(
    "change",
    tinhTien
);


// ===============================
// ĐỔI SỐ LƯỢNG
// ===============================

quantityInput.addEventListener(
    "input",
    tinhTien
);


// ===============================
// NHẬN DỊCH VỤ TỪ SIDEBAR
// ===============================

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const urlPlatform =
    urlParams.get("platform");


const urlService =
    urlParams.get("service");


// ===============================
// MAP TÊN NỀN TẢNG
// ===============================

const platformMap = {

    Facebook: "Facebook",

    TikTok: "TikTok",

    Instagram: "Instagram",

    Youtube: "YouTube",

    YouTube: "YouTube",

    Shopee: "Shopee",

    Google: "Google",

    Telegram: "Telegram",

    XTwitter: "X-Twitter",

    "X-Twitter": "X-Twitter",

    Threads: "Threads",

    Lazada: "Lazada"
};


// ===============================
// XỬ LÝ PLATFORM TỪ URL
// ===============================

if (urlPlatform) {

    const mappedPlatform =
        platformMap[urlPlatform];


    if (mappedPlatform) {

        platformSelect.value =
            mappedPlatform;

        locDichVu();
    }
}


// ===============================
// XỬ LÝ SERVICE TỪ URL
// ===============================

if (urlService) {

    const option =
        Array.from(
            serviceSelect.options
        ).find(function(item) {

            return item.value === urlService;

        });


    if (option) {

        serviceSelect.value =
            urlService;

        tinhTien();
    }
}


// ===============================
// CHẠY LẦN ĐẦU
// ===============================

if (!urlPlatform) {

    locDichVu();

} else {

    tinhTien();

}

</script>
