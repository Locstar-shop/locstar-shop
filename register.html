<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký - LOC STAR</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f6fa;
    min-height: 100vh;
}

.header {
    background: #30265b;
    color: white;
    padding: 20px 40px;
    font-size: 28px;
    font-weight: bold;
}

.container {
    width: 500px;
    max-width: 90%;
    margin: 60px auto;
}

.register-box {
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    color: #30265b;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #333;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #347ee8;
}

.btn-register {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 6px;
    background: #347ee8;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-register:hover {
    background: #2568c7;
}

.btn-register:disabled {
    background: #999;
    cursor: not-allowed;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #347ee8;
    text-decoration: none;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="header">
    LOC STAR
</div>

<div class="container">

    <div class="register-box">

        <h1>Đăng ký tài khoản</h1>

        <form onsubmit="registerAccount(event)">

            <label>Tên tài khoản</label>
            <input
                type="text"
                id="username"
                placeholder="Nhập tên tài khoản"
                minlength="3"
                maxlength="30"
                required
            >

            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Nhập email"
                required
            >

            <label>Mật khẩu</label>
            <input
                type="password"
                id="password"
                placeholder="Nhập mật khẩu"
                minlength="6"
                required
            >

            <label>Xác nhận mật khẩu</label>
            <input
                type="password"
                id="confirm"
                placeholder="Nhập lại mật khẩu"
                minlength="6"
                required
            >

            <button
                class="btn-register"
                id="registerButton"
                type="submit"
            >
                ĐĂNG KÝ
            </button>

            <div
                class="message"
                id="message"
            ></div>

        </form>

        <a class="back" href="index.html">
            ← Quay lại trang chủ
        </a>

    </div>

</div>

<script>
const API_URL = "https://locstar-shop-api.onrender.com";

async function registerAccount(event) {
    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirm =
        document.getElementById("confirm").value;

    const button =
        document.getElementById("registerButton");

    const message =
        document.getElementById("message");

    message.textContent = "";
    message.style.color = "";

    if (password !== confirm) {
        message.textContent =
            "Mật khẩu xác nhận không giống nhau!";
        message.style.color = "red";
        return;
    }

    if (password.length < 6) {
        message.textContent =
            "Mật khẩu phải có ít nhất 6 ký tự!";
        message.style.color = "red";
        return;
    }

    button.disabled = true;
    button.textContent = "ĐANG ĐĂNG KÝ...";

    try {
        const response = await fetch(
            `${API_URL}/api/auth/register`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    email,
                    password
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message ||
                "Đăng ký thất bại"
            );
        }

        // Chỉ lưu thông tin không nhạy cảm.
        // KHÔNG lưu mật khẩu.
        localStorage.setItem(
            "username",
            data.user.username
        );

        localStorage.setItem(
            "email",
            data.user.email
        );

        if (data.token) {
            localStorage.setItem(
                "auth_token",
                data.token
            );
        }

        alert(
            "Đăng ký tài khoản thành công!"
        );

        window.location.href =
            "index.html";

    } catch (error) {

        console.error(error);

        message.textContent =
            error.message ||
            "Không thể kết nối máy chủ.";

        message.style.color = "red";

        button.disabled = false;
        button.textContent = "ĐĂNG KÝ";
    }
}
</script>

</body>
</html>
