<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tài khoản - LOC STAR</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f8;
}

.header {
    background: #34265f;
    color: white;
    padding: 25px 40px;
    font-size: 30px;
    font-weight: bold;
}

.container {
    max-width: 600px;
    margin: 50px auto;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #34265f;
    margin-bottom: 30px;
}

.info {
    font-size: 18px;
    margin: 20px 0;
    padding: 15px;
    background: #f5f6fa;
    border-radius: 8px;
}

.label {
    font-weight: bold;
}

.balance {
    font-size: 25px;
    font-weight: bold;
    color: #16a34a;
}

.deposit-code {
    font-size: 22px;
    font-weight: bold;
    color: #2878e5;
    letter-spacing: 1px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 7px;
    background: #e53935;
    color: white;
    font-size: 17px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #c62828;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #2878e5;
    text-decoration: none;
}

.loading {
    text-align: center;
    color: #666;
    margin: 20px 0;
}
</style>
</head>

<body>

<div class="header">
    LOC STAR
</div>

<div class="container">

    <h1>Tài khoản của tôi</h1>

    <div id="loading" class="loading">
        Đang tải thông tin tài khoản...
    </div>

    <div id="accountInfo" style="display:none;">

        <div class="info">
            <span class="label">Tên tài khoản:</span>
            <span id="username"></span>
        </div>

        <div class="info">
            <span class="label">Email:</span>
            <span id="email"></span>
        </div>

        <div class="info">
            <span class="label">Số dư:</span>
            <div class="balance" id="balance">0 VNĐ</div>
        </div>

        <div class="info">
            <span class="label">Mã nạp tiền:</span>
            <div class="deposit-code" id="depositCode"></div>

            <p style="font-size:14px;color:#666;margin-bottom:0;">
                Dùng mã này trong nội dung chuyển khoản để hệ thống nhận diện tài khoản.
            </p>
        </div>

        <button onclick="logout()">
            Đăng xuất
        </button>

    </div>

    <a class="back" href="index.html">
        ← Quay lại trang chủ
    </a>

</div>

<script>

const API_URL =
    "https://locstar-shop-api.onrender.com";


async function loadAccount() {

    const token =
        localStorage.getItem("authToken");

    const loading =
        document.getElementById("loading");

    const accountInfo =
        document.getElementById("accountInfo");


    if (!token) {

        loading.style.color = "red";

        loading.textContent =
            "Bạn chưa đăng nhập. Đang chuyển đến trang đăng nhập...";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1200);

        return;
    }


    try {

        const response =
            await fetch(
                API_URL + "/api/account/me",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            localStorage.removeItem("authToken");
            localStorage.removeItem("loggedIn");

            loading.style.color = "red";

            loading.textContent =
                "Phiên đăng nhập đã hết hạn. Đang chuyển đến trang đăng nhập...";

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1200);

            return;
        }


        document.getElementById("username").textContent =
            data.user.username || "";

        document.getElementById("email").textContent =
            data.user.email || "Chưa có email";

        document.getElementById("balance").textContent =
            Number(data.user.balance || 0).toLocaleString("vi-VN") +
            " VNĐ";

        document.getElementById("depositCode").textContent =
            data.user.depositCode || "";


        loading.style.display = "none";

        accountInfo.style.display = "block";


    } catch (error) {

        console.error(error);

        loading.style.color = "red";

        loading.textContent =
            "Không thể kết nối máy chủ.";
    }
}


function logout() {

    localStorage.removeItem("authToken");
    localStorage.removeItem("username");
    localStorage.removeItem("email");
    localStorage.removeItem("depositCode");
    localStorage.removeItem("loggedIn");

    alert("Đã đăng xuất!");

    window.location.href =
        "index.html";
}


loadAccount();

</script>

</body>
</html>
