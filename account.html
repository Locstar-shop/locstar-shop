<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tài khoản - LOC STAR</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f8;
}

.header {
    background: #34265f;
    color: white;
    padding: 25px 40px;
    font-size: 30px;
    font-weight: bold;
}

.container {
    max-width: 600px;
    margin: 50px auto;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #34265f;
}

.info {
    font-size: 18px;
    margin: 20px 0;
    padding: 15px;
    background: #f5f6fa;
    border-radius: 8px;
}

.label {
    font-weight: bold;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 7px;
    background: #e53935;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #c62828;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #2878e5;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="header">
    LOC STAR
</div>

<div class="container">

    <h1>Tài khoản của tôi</h1>

    <div class="info">
        <span class="label">Tên tài khoản:</span>
        <span id="username"></span>
    </div>

    <div class="info">
        <span class="label">Email:</span>
        <span id="email"></span>
    </div>

    <button onclick="logout()">Đăng xuất</button>

    <a class="back" href="index.html">
        ← Quay lại trang chủ
    </a>

</div>

<script>

const username = localStorage.getItem("username");
const email = localStorage.getItem("email");

document.getElementById("username").textContent =
    username || "Chưa đăng nhập";

document.getElementById("email").textContent =
    email || "Chưa có email";

function logout() {
    localStorage.removeItem("loggedIn");

    alert("Đã đăng xuất!");

    window.location.href = "index.html";
}

</script>

</body>
</html>
